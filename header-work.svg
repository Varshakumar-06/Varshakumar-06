<svg width="960" height="100" viewBox="0 0 960 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="baseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59143F"/>
      <stop offset="50%" stop-color="#FF2D75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A1033"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="50%" stop-color="#FF4F91"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="roseCTA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C0B25"/>
      <stop offset="50%" stop-color="#3A1033"/>
      <stop offset="100%" stop-color="#24091F"/>
    </linearGradient>
  </defs>

  <rect width="960" height="100" rx="18" fill="url(#hwBg)"/>
  
    <!-- Static Gradient Border -->
    <rect x="3" y="3" width="954" height="94" rx="18" fill="none" stroke="url(#baseBorder)" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Glow Aura -->
    <rect x="3" y="3" width="954" height="94" rx="18" fill="none" stroke="#FF4F91" stroke-width="6" stroke-dasharray="150 1939" stroke-linecap="round" opacity="0.35" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-2089" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Core Light Trail -->
    <rect x="3" y="3" width="954" height="94" rx="18" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-dasharray="150 1939" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-2089" dur="4s" repeatCount="indefinite"/>
    </rect>

  <text x="42" y="34" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="2">03 • SELECTED WORK</text>
  <text x="42" y="68" fill="#FFF" font-family="Georgia,serif" font-size="30" font-weight="800">Products, not assignments.</text>
  <text x="560" y="66" fill="#A87698" font-family="'Segoe UI',Roboto,sans-serif" font-size="12">Six verified engineering repositories.</text>
</svg>