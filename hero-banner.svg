<svg width="960" height="460" viewBox="0 0 960 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59143F"/>
      <stop offset="50%" stop-color="#FF2D75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A1033"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="50%" stop-color="#FF4F91"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="roseCTA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C0B25"/>
      <stop offset="30%" stop-color="#3A1033"/>
      <stop offset="60%" stop-color="#24091F"/>
      <stop offset="100%" stop-color="#1A0618"/>
    </linearGradient>
    <radialGradient id="heroGlow1" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF2D75" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF2D75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#59143F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#59143F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E1242"/>
      <stop offset="50%" stop-color="#2E0A28"/>
      <stop offset="100%" stop-color="#1E061A"/>
    </linearGradient>
    <linearGradient id="goldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Panel -->
  <rect width="960" height="460" rx="22" fill="url(#heroBg)"/>
  <rect width="960" height="460" rx="22" fill="url(#heroGlow1)"/>
  <rect width="960" height="460" rx="22" fill="url(#heroGlow2)"/>

  <!-- Static Gradient Border -->
  <rect x="3" y="3" width="954" height="454" rx="22" fill="none" stroke="url(#baseBorder)" stroke-width="1.2" stroke-opacity="0.7"/>
  <!-- Glowing Light Trail Aura -->
  <rect x="3" y="3" width="954" height="454" rx="22" fill="none" stroke="#FF4F91" stroke-width="6" stroke-dasharray="240 2562" stroke-linecap="round" opacity="0.35" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-2802" dur="6s" repeatCount="indefinite"/>
  </rect>
  <!-- Core Light Trail -->
  <rect x="3" y="3" width="954" height="454" rx="22" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-dasharray="240 2562" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2802" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Glowing Particles -->
  <circle cx="120" cy="80" r="1.5" fill="#FF4F91" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="420" r="2" fill="#FF2D75" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="50" r="1.5" fill="#FF6B9D" opacity="0.5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="380" r="1" fill="#FF4F91" opacity="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- Top Category Pill -->
  <g transform="translate(48,42)">
    <rect width="400" height="28" rx="14" fill="#FF2D75" fill-opacity="0.15" stroke="#FF2D75" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#FF2D75"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
    <text x="30" y="18" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">01 • ENGINEERING • EMBEDDED SYSTEMS • VLSI • IoT</text>
  </g>

  <!-- Big Name -->
  <text x="48" y="135" fill="#FFFFFF" font-family="Georgia,serif" font-size="52" font-weight="800">B. Varsha Kumar.</text>

  <!-- Subtitle Pill -->
  <g transform="translate(48,155)">
    <rect width="490" height="28" rx="14" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.3" stroke-width="1"/>
    <text x="18" y="18" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">ECE UNDERGRAD • SRM UNIVERSITY AP • CLASS OF 2027 • CGPA: 7.52</text>
  </g>

  <!-- Taglines -->
  <text x="48" y="222" fill="#F472B6" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="500">Building reliable hardware-software systems from silicon to cloud.</text>
  <text x="48" y="250" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="13">Embedded Firmware • VLSI Design • IoT Architectures • Computer Vision • Web Engineering</text>

  <!-- Interactive CTA Buttons Row -->
  <g transform="translate(48,285)">
    <rect width="220" height="44" rx="22" fill="url(#roseCTA)"/>
    <text x="110" y="28" fill="#FFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">🚀 EXPLORE PORTFOLIO ➔</text>
  </g>
  <g transform="translate(282,285)">
    <rect width="140" height="44" rx="22" fill="none" stroke="#FF2D75" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="70" y="28" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">💼 LinkedIn</text>
  </g>
  <g transform="translate(436,285)">
    <rect width="130" height="44" rx="22" fill="none" stroke="#FF2D75" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="65" y="28" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐙 GitHub</text>
  </g>
  <g transform="translate(580,285)">
    <rect width="125" height="44" rx="22" fill="none" stroke="#FF2D75" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="62" y="28" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">✉️ Email</text>
  </g>

  <!-- Institution Badge (Bottom Left) -->
  <g transform="translate(48,365)">
    <rect width="400" height="60" rx="14" fill="#24091F" stroke="#59143F" stroke-width="1.2"/>
    <circle cx="28" cy="30" r="14" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.5"/>
    <text x="28" y="35" fill="#FF4F91" font-family="Georgia,serif" font-size="14" font-weight="800" text-anchor="middle">SRM</text>
    <text x="54" y="26" fill="#FFFFFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700">SRM University AP, Andhra Pradesh</text>
    <text x="54" y="44" fill="#FF8CB2" font-family="'Segoe UI',Roboto,sans-serif" font-size="11">Electronics &amp; Communication Engineering • Active Undergrad</text>
  </g>

  <!-- Right Side: Glowing Vector ECE Core & Orbital Medallion -->
  <!-- Ambient Core Glow -->
  <circle cx="785" cy="215" r="130" fill="#FF2D75" opacity="0.08" filter="url(#softGlow)"/>
  
  <!-- Outer Dash Orbit Ring 1 (Clockwise Rotation) -->
  <ellipse cx="785" cy="215" rx="125" ry="125" stroke="#FF2D75" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="10 8">
    <animateTransform attributeName="transform" type="rotate" from="0 785 215" to="360 785 215" dur="25s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Counter-Rotating Orbit Ring 2 -->
  <ellipse cx="785" cy="215" rx="108" ry="108" stroke="#FF6B9D" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="360 785 215" to="0 785 215" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Solid Neon Frame -->
  <circle cx="785" cy="215" r="92" stroke="#FF4F91" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Silicon Chip Medallion Body -->
  <rect x="720" y="150" width="130" height="130" rx="20" fill="url(#chipGrad)" stroke="#FF2D75" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Microchip Lead Pins (Top & Bottom) -->
  <g stroke="#FF6B9D" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="740" y1="144" x2="740" y2="150"/><line x1="762" y1="144" x2="762" y2="150"/>
    <line x1="785" y1="144" x2="785" y2="150"/><line x1="808" y1="144" x2="808" y2="150"/>
    <line x1="830" y1="144" x2="830" y2="150"/>
    <line x1="740" y1="280" x2="740" y2="286"/><line x1="762" y1="280" x2="762" y2="286"/>
    <line x1="785" y1="280" x2="785" y2="286"/><line x1="808" y1="280" x2="808" y2="286"/>
    <line x1="830" y1="280" x2="830" y2="286"/>
    <!-- Left & Right -->
    <line x1="714" y1="170" x2="720" y2="170"/><line x1="714" y1="192" x2="720" y2="192"/>
    <line x1="714" y1="215" x2="720" y2="215"/><line x1="714" y1="238" x2="720" y2="238"/>
    <line x1="714" y1="260" x2="720" y2="260"/>
    <line x1="850" y1="170" x2="856" y2="170"/><line x1="850" y1="192" x2="856" y2="192"/>
    <line x1="850" y1="215" x2="856" y2="215"/><line x1="850" y1="238" x2="856" y2="238"/>
    <line x1="850" y1="260" x2="856" y2="260"/>
  </g>

  <!-- Central Die Ring -->
  <circle cx="785" cy="215" r="42" fill="#24091F" stroke="url(#roseCTA)" stroke-width="1.8"/>

  <!-- Golden Tree / Knowledge Silicon Core (Stylized Vector) -->
  <!-- Tree Trunk & Roots -->
  <path d="M785 235 L785 208 M783 235 L778 242 M787 235 L792 242" stroke="url(#goldGold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Canopy Foliage Leaves -->
  <circle cx="785" cy="198" r="7" fill="url(#goldGold)"/>
  <circle cx="776" cy="204" r="5.5" fill="url(#goldGold)"/>
  <circle cx="794" cy="204" r="5.5" fill="url(#goldGold)"/>
  <circle cx="770" cy="214" r="4.5" fill="url(#goldGold)"/>
  <circle cx="800" cy="214" r="4.5" fill="url(#goldGold)"/>
  <circle cx="785" cy="212" r="4" fill="url(#goldGold)"/>

  <!-- Circular Arch Text around Medallion -->
  <text x="785" y="172" fill="#FF8CB2" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" text-anchor="middle">SRM UNIVERSITY AP</text>
  <text x="785" y="268" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" text-anchor="middle">LEARN • LEAP • LEAD</text>

  <!-- Orbit Status Pill -->
  <g transform="translate(712,350)">
    <rect width="146" height="26" rx="13" fill="#24091F" stroke="#FF2D75" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="13" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">ECE DEPT • CLASS '27</text>
  </g>
</svg>