<svg width="960" height="200" viewBox="0 0 960 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0c27"/>
      <stop offset="50%" stop-color="#1d071b"/>
      <stop offset="100%" stop-color="#140413"/>
    </linearGradient>
    <linearGradient id="connBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d75"/>
      <stop offset="100%" stop-color="#ff6584"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="956" height="196" rx="18" fill="url(#connBg)" stroke="#45143a" stroke-width="1.5"/>

  <text x="48" y="44" fill="#ff6584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">06 • CONNECT</text>
  <text x="48" y="82" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="800">Let's build something worth explaining.</text>
  <text x="48" y="112" fill="#d4a5c3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">Seeking 2027 ECE &amp; Software Engineering roles in Embedded Systems, VLSI Design, and IoT.</text>

  <!-- Action Pill 1: Portfolio -->
  <g transform="translate(48, 136)">
    <rect width="180" height="38" rx="19" fill="url(#connBtnGrad)"/>
    <text x="90" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">🚀 LIVE PORTFOLIO</text>
  </g>

  <!-- Action Pill 2: LinkedIn -->
  <g transform="translate(242, 136)">
