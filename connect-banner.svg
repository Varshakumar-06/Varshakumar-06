<svg width="960" height="210" viewBox="0 0 960 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="baseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59143F"/>
      <stop offset="50%" stop-color="#FF2D75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A1033"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="50%" stop-color="#FF4F91"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="roseCTA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1033"/>
      <stop offset="40%" stop-color="#2C0B25"/>
      <stop offset="100%" stop-color="#200820"/>
    </linearGradient>
    <radialGradient id="connGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF2D75" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF2D75" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="210" rx="20" fill="url(#connBg)"/>
  <rect width="960" height="210" rx="20" fill="url(#connGlow)"/>
  
    <!-- Static Gradient Border -->
    <rect x="3" y="3" width="954" height="204" rx="20" fill="none" stroke="url(#baseBorder)" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Glow Aura -->
    <rect x="3" y="3" width="954" height="204" rx="20" fill="none" stroke="#FF4F91" stroke-width="6" stroke-dasharray="200 2105" stroke-linecap="round" opacity="0.35" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-2305" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Core Light Trail -->
    <rect x="3" y="3" width="954" height="204" rx="20" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-dasharray="200 2105" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-2305" dur="5.5s" repeatCount="indefinite"/>
    </rect>

  <text x="48" y="40" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="2">06 • CONNECT</text>
  <text x="48" y="80" fill="#FFF" font-family="Georgia,serif" font-size="30" font-weight="800">Let's build something worth explaining.</text>
  <text x="48" y="112" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="13.5">Seeking 2027 ECE &amp; Software Engineering roles in Embedded Systems, VLSI Design, and IoT.</text>

  <g transform="translate(48,138)">
    <rect width="185" height="40" rx="20" fill="url(#roseCTA)"/>
    <text x="92" y="26" fill="#FFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">🚀 LIVE PORTFOLIO</text>
  </g>
  <g transform="translate(248,138)">
    <rect width="140" height="40" rx="20" fill="none" stroke="#FF2D75" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="70" y="26" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">💼 LINKEDIN</text>
  </g>
  <g transform="translate(403,138)">
    <rect width="195" height="40" rx="20" fill="none" stroke="#FF2D75" stroke-opacity="0.5" stroke-width="1.3"/>
    <text x="97" y="26" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✉️ varshakumarballi@gmail.com</text>
  </g>
</svg>