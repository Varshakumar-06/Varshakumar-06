    <text x="70" y="24" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">💼 LINKEDIN</text>
  </g>

  <!-- Action Pill 3: Email -->
  <g transform="translate(396, 136)">
    <rect width="190" height="38" rx="19" fill="#250920" stroke="#ff2d75" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="95" y="24" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">✉️ SEND AN EMAIL</text>
