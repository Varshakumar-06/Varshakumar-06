<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="baseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59143F"/>
      <stop offset="50%" stop-color="#FF2D75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A1033"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="50%" stop-color="#FF4F91"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="roseCTA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E0C28"/>
      <stop offset="50%" stop-color="#3A1033"/>
      <stop offset="100%" stop-color="#200820"/>
    </linearGradient>
    <radialGradient id="aboutGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D75" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF2D75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340D2E"/>
      <stop offset="100%" stop-color="#240921"/>
    </linearGradient>
  </defs>

  <rect width="960" height="300" rx="20" fill="url(#aboutBg)"/>
  <rect width="960" height="300" rx="20" fill="url(#aboutGlow)"/>
  
    <!-- Static Gradient Border -->
    <rect x="3" y="3" width="954" height="294" rx="20" fill="none" stroke="url(#baseBorder)" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Glow Aura -->
    <rect x="3" y="3" width="954" height="294" rx="20" fill="none" stroke="#FF4F91" stroke-width="6" stroke-dasharray="190 2295" stroke-linecap="round" opacity="0.35" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-2485" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- Core Light Trail -->
    <rect x="3" y="3" width="954" height="294" rx="20" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-dasharray="190 2295" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-2485" dur="5s" repeatCount="indefinite"/>
    </rect>

  <!-- Section Header -->
  <text x="42" y="38" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="2">02 • ABOUT</text>
  <text x="42" y="70" fill="#FFFFFF" font-family="Georgia,serif" font-size="28" font-weight="700">Hello, I'm Varsha.</text>

  <!-- Terminal Window -->
  <g transform="translate(42,90)">
    <rect width="460" height="170" rx="14" fill="url(#termBg)" stroke="#FF2D75" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="22" cy="20" r="5" fill="#F43F5E"/><circle cx="40" cy="20" r="5" fill="#FB7185" opacity="0.5"/><circle cx="58" cy="20" r="5" fill="#FDA4AF" opacity="0.3"/>
    <text x="22" y="52" fill="#FF6B9D" font-family="'Fira Code',monospace" font-size="12" font-weight="600">$ identity</text>
    <text x="135" y="52" fill="#FFF" font-family="'Fira Code',monospace" font-size="12">B. Varsha Kumar (ECE '27)</text>
    <text x="22" y="80" fill="#FF6B9D" font-family="'Fira Code',monospace" font-size="12" font-weight="600">$ university</text>
    <text x="135" y="80" fill="#FBCFE8" font-family="'Fira Code',monospace" font-size="12">SRM University AP • CGPA: 7.52</text>
    <text x="22" y="108" fill="#FF6B9D" font-family="'Fira Code',monospace" font-size="12" font-weight="600">$ focus</text>
    <text x="135" y="108" fill="#E2CAD8" font-family="'Fira Code',monospace" font-size="12">Embedded Systems, VLSI, IoT, CV</text>
    <text x="22" y="136" fill="#FF6B9D" font-family="'Fira Code',monospace" font-size="12" font-weight="600">$ mission</text>
    <text x="135" y="136" fill="#34D399" font-family="'Fira Code',monospace" font-size="12">Silicon logic → smart software.</text>
  </g>

  <!-- Right Bio Panel -->
  <g transform="translate(524,90)">
    <rect width="400" height="170" rx="14" fill="#280A23" stroke="#59143F" stroke-width="1"/>
    <text x="22" y="34" fill="#FFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700">Hardware Precision × Modern Software</text>
    <text x="22" y="62" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12">An ECE undergrad passionate about physical computing</text>
    <text x="22" y="82" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12">and building systems from transistor to cloud.</text>
    <text x="22" y="112" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12">From writing C firmware on PIC microcontrollers to</text>
    <text x="22" y="132" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12">designing CMOS layouts in Cadence Virtuoso and deploying</text>
    <text x="22" y="152" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12">real-time OpenCV vision pipelines.</text>
  </g>
</svg>