<svg width="960" height="220" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="baseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59143F"/>
      <stop offset="50%" stop-color="#FF2D75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A1033"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="50%" stop-color="#FF4F91"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="roseCTA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="pcBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#300F2C"/>
      <stop offset="100%" stop-color="#200820"/>
    </linearGradient>
    <radialGradient id="pcGlow3" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FF2D75" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF2D75" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="220" rx="18" fill="url(#pcBg3)"/>
  <rect width="960" height="220" rx="18" fill="url(#pcGlow3)"/>
  
    <!-- Static Gradient Border -->
    <rect x="3" y="3" width="954" height="214" rx="18" fill="none" stroke="url(#baseBorder)" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Glow Aura -->
    <rect x="3" y="3" width="954" height="214" rx="18" fill="none" stroke="#FF4F91" stroke-width="6" stroke-dasharray="180 2149" stroke-linecap="round" opacity="0.35" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-2329" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- Core Light Trail -->
    <rect x="3" y="3" width="954" height="214" rx="18" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-dasharray="180 2149" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-2329" dur="5s" repeatCount="indefinite"/>
    </rect>

  <text x="42" y="38" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">03 | DETERMINISTIC FIRMWARE | EMBEDDED C</text>
  <text x="42" y="76" fill="#FFF" font-family="Georgia,serif" font-size="24" font-weight="700">PIC16F877A Washing Machine Controller</text>
  <text x="42" y="108" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12.5">Industrial FSM firmware on PIC16F877A with hardware Timer0 interrupts,</text>
  <text x="42" y="128" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="12.5">matrix keypad decoding, and 16x2 LCD diagnostics validated in PICSimLab.</text>

  
    <g transform="translate(42,158)">
      <rect width="101.0" height="26" rx="13" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.35" stroke-width="1"/>
      <text x="50.5" y="17" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">PIC16F877A</text>
    </g>
    <g transform="translate(151.0,158)">
      <rect width="101.0" height="26" rx="13" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.35" stroke-width="1"/>
      <text x="50.5" y="17" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Embedded C</text>
    </g>
    <g transform="translate(260.0,158)">
      <rect width="108.5" height="26" rx="13" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.35" stroke-width="1"/>
      <text x="54.25" y="17" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">MPLAB X IDE</text>
    </g>
    <g transform="translate(376.5,158)">
      <rect width="93.5" height="26" rx="13" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.35" stroke-width="1"/>
      <text x="46.75" y="17" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">PICSimLab</text>
    </g>
    <g transform="translate(478.0,158)">
      <rect width="70" height="26" rx="13" fill="#3A1033" stroke="#FF2D75" stroke-opacity="0.35" stroke-width="1"/>
      <text x="35.0" y="17" fill="#FBCFE8" font-family="'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">FSM</text>
    </g>

  <g transform="translate(740,76)">
    <rect width="185" height="42" rx="21" fill="url(#roseCTA)"/>
    <text x="92" y="27" fill="#FFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">VIEW REPOSITORY ➔</text>
  </g>
</svg>