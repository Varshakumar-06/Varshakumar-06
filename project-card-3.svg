  <!-- Title -->
  <text x="42" y="74" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700">Industrial Washing Machine Controller</text>

  <!-- Description -->
  <text x="42" y="104" fill="#d4a5c3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" width="800">
    <tspan x="42" dy="0">Industrial-grade washing machine firmware programmed on PIC16F877A. Built on a non-blocking Finite State Machine (F</tspan>
    <tspan x="42" dy="19">SM) utilizing hardware Timer0 interrupts, matrix keypad decoding, and 16x2 LCD diagnostics.</tspan>
  </text>

