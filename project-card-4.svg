<svg width="960" height="215" viewBox="0 0 960 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcardBg_Weather-Monitoring-System" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21081e"/>
      <stop offset="100%" stop-color="#160414"/>
    </linearGradient>
    <linearGradient id="pBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d75"/>
      <stop offset="100%" stop-color="#ff6584"/>
