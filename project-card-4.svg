  <rect x="2" y="2" width="956" height="211" rx="16" fill="url(#pcardBg_Weather-Monitoring-System)" stroke="#431439" stroke-width="1.3"/>

  <!-- Category Tag -->
  <text x="42" y="38" fill="#ff6584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">04 | CLOUD TELEMETRY & SENSORS | ESP32 • BLYNK IOT</text>

  <!-- Title -->
  <text x="42" y="74" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700">IoT Weather Monitoring Terminal</text>

  <!-- Description -->
  <text x="42" y="104" fill="#d4a5c3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" width="800">
    <tspan x="42" dy="0">Continuous meteorological data acquisition terminal capturing ambient temperature and relative humidity via digital</tspan>
    <tspan x="42" dy="19"> transducers. Synchronizes metrics in real time with Blynk IoT cloud dashboards and mobile alert thresholds.</tspan>
  </text>

  <!-- Pills -->
  
    <g transform="translate(42, 145)">
