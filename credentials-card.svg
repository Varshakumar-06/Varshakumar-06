<svg width="960" height="210" viewBox="0 0 960 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="baseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59143F"/>
      <stop offset="50%" stop-color="#FF2D75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A1033"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="50%" stop-color="#FF4F91"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="roseCTA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D75"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="credBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C0B25"/>
      <stop offset="50%" stop-color="#341230"/>
      <stop offset="100%" stop-color="#240921"/>
    </linearGradient>
    <linearGradient id="credC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1033"/>
      <stop offset="100%" stop-color="#280A23"/>
    </linearGradient>
  </defs>

  <rect width="960" height="210" rx="18" fill="url(#credBg)"/>
  
    <!-- Static Gradient Border -->
    <rect x="3" y="3" width="954" height="204" rx="18" fill="none" stroke="url(#baseBorder)" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Glow Aura -->
    <rect x="3" y="3" width="954" height="204" rx="18" fill="none" stroke="#FF4F91" stroke-width="6" stroke-dasharray="180 2129" stroke-linecap="round" opacity="0.35" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-2309" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- Core Light Trail -->
    <rect x="3" y="3" width="954" height="204" rx="18" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-dasharray="180 2129" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-2309" dur="5s" repeatCount="indefinite"/>
    </rect>

  <text x="42" y="34" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">05 • CREDENTIALS, VERIFIED</text>
  <text x="42" y="64" fill="#FFF" font-family="Georgia,serif" font-size="24" font-weight="700">Industry Training &amp; Certifications</text>

  <g transform="translate(42,84)">
    <rect width="420" height="100" rx="14" fill="url(#credC)" stroke="#FF2D75" stroke-opacity="0.3" stroke-width="1"/>
    <text x="22" y="30" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="1">EMERTXE INFORMATION TECHNOLOGIES</text>
    <text x="22" y="54" fill="#FFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700">Advanced Embedded Systems Training</text>
    <text x="22" y="74" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5">Embedded C, Linux Internals &amp; Microcontroller Architectures</text>
    <text x="22" y="92" fill="#10B981" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">✓ CERTIFIED (MAY – JUNE 2025)</text>
  </g>

  <g transform="translate(498,84)">
    <rect width="420" height="100" rx="14" fill="url(#credC)" stroke="#FF2D75" stroke-opacity="0.3" stroke-width="1"/>
    <text x="22" y="30" fill="#FF6B9D" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="1">TATA CONSULTANCY SERVICES (FORAGE)</text>
    <text x="22" y="54" fill="#FFF" font-family="'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700">Cybersecurity Analyst Job Simulation</text>
    <text x="22" y="74" fill="#D4A5C3" font-family="'Segoe UI',Roboto,sans-serif" font-size="11.5">Threat Vectors, IAM Governance &amp; Incident Response</text>
    <text x="22" y="92" fill="#10B981" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">✓ CERTIFIED SIMULATION</text>
  </g>
</svg>