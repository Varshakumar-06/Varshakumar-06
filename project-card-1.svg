  <text x="42" y="104" fill="#d4a5c3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" width="800">
    <tspan x="42" dy="0">Real-time safety vision pipeline tracking facial landmarks and Eye Aspect Ratio (EAR). Prolonged eye closure dispat</tspan>
    <tspan x="42" dy="19">ches serial UART pulses to an Arduino Uno, triggering high-decibel buzzers and visual LED strobes.</tspan>
  </text>

