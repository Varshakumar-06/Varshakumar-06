name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Varshakumar-06
          outputs: |
            dist/github-snake.svg?color_snake=#00BFFF&color_dots=#E3F2FD,#90CAF9,#42A5F5,#1E88E5,#0D47A1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FFFF&color_dots=#003B46,#006D77,#00A8A8,#00D9FF,#7DF9FF

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
